<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Primário -->
    <title>Marmita Congelada em SP | RapChef — Comida Caseira Pronta em 5 Min</title>
    <meta
      name="description"
      content="Marmitas congeladas gourmet (400g) e fitness (300g) em São Paulo. 35 sabores, prontas em 5 minutos no micro-ondas, até 51% mais barato que delivery. Combo Mensal com frete grátis. Peça pelo WhatsApp!"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#18181b" />
    <link rel="canonical" href="https://www.rapchef.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="RapChef Delivery" />
    <meta property="og:title" content="Marmita Congelada em SP | RapChef — Comida Caseira em 5 Minutos" />
    <meta
      property="og:description"
      content="Marmitas gourmet e fitness congeladas em São Paulo. 35 sabores, R$ 21,90 por refeição, até 51% mais barato que delivery. Combo Mensal com frete grátis."
    />
    <meta property="og:url" content="https://www.rapchef.com.br/" />
    <meta property="og:image" content="https://www.rapchef.com.br/imagens/logo.webp" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Marmita Congelada em SP | RapChef" />

      name="twitter:description"
      content="Marmitas gourmet e fitness congeladas. Prontas em 5 min, até 51% mais barato que delivery. Entrega em SP, Grande SP e ABC."

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    />

    <!-- Structured Data: Restaurant (LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "RapChef Delivery",
      "description": "Marmitas congeladas gourmet e fitness em São Paulo. Comida caseira pronta em 5 minutos no micro-ondas, entrega em SP, Grande SP e ABC.",
      "servesCuisine": ["Brasileira", "Comida caseira", "Marmita fitness"],
      "priceRange": "$$",
      "telephone": "+55-11-98850-4312",
      "url": "https://www.rapchef.com.br/",
      "image": "https://www.rapchef.com.br/imagens/logo.webp",
      "logo": "https://www.rapchef.com.br/imagens/logo.webp",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "São Paulo",
        "addressRegion": "SP",
        "addressCountry": "BR"
      },
      "areaServed": [
        { "@type": "City", "name": "São Paulo" },
        { "@type": "AdministrativeArea", "name": "Grande São Paulo" },
        { "@type": "AdministrativeArea", "name": "ABC Paulista" }
      ],
      "paymentAccepted": "PIX, Cartão de crédito, Cartão de débito (pagamento na entrega)",
      "sameAs": ["https://www.instagram.com/rapchef.deliverysp/"]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Vocês entregam na minha cidade?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atendemos São Paulo, Grande São Paulo e ABC. As marmitas chegam em embalagem térmica especial que mantém tudo 100% congelado. Consulte o frete promocional no WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o pedido mínimo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O pedido mínimo é de R$ 50,00. Você pode montar seu pedido ou escolher um dos nossos combos: Semanal (5 unidades por R$ 109,50) ou Mensal (20 unidades por R$ 438,00 com frete grátis)."
          }
        },
        {
          "@type": "Question",
          "name": "Posso escolher os sabores que quiser?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Em todos os combos você escolhe quais sabores quer entre os 35 disponíveis no cardápio. Total liberdade de escolha."
          }
        },
        {
          "@type": "Question",
          "name": "Comida congelada perde sabor e nutrientes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Usamos congelamento industrial rápido, que preserva 100% do sabor, textura, nutrientes e frescor. Não usamos conservantes químicos — o próprio congelamento preserva tudo naturalmente."
          }
        },
        {
          "@type": "Question",
          "name": "Como faço para esquentar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Retire a marmita do congelador, remova a tampa plástica e coloque no micro-ondas por 5 minutos em potência alta. A embalagem é própria para micro-ondas e vai direto do congelador para o micro-ondas."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o prazo de validade?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As marmitas duram até 180 dias (6 meses) no congelador. Todas vêm com etiquetas contendo data de fabricação e validade."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o tamanho das porções?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Marmitas Gourmet: 400g por unidade. Marmitas Fitness: 300g por unidade. Ambas são porções completas e satisfatórias para uma refeição."
          }
        },
        {
          "@type": "Question",
          "name": "Quais formas de pagamento aceitam?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pagamento na entrega: PIX (QR Code na entrega), Cartão de Crédito e Cartão de Débito (maquininha na entrega), todos sem taxas adicionais. Não parcelamos pagamentos."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto vou economizar comparado ao delivery?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Delivery comum custa R$ 35 a 45 por refeição; na RapChef é R$ 21,90 — até 51% mais barato. Em um mês (20 refeições): delivery R$ 800 vs RapChef R$ 438, uma economia de R$ 362 por mês."
          }
        },
        {
          "@type": "Question",
          "name": "Atendem empresas ou pedidos para PJ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Atendemos empresas que querem oferecer marmitas para seus colaboradores. Entre em contato pelo WhatsApp (11) 98850-4312 para solicitar um orçamento personalizado corporativo."
          }
        }
      ]
    }
    </script>
